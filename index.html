<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yageno AI</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    textarea { width: 100%; height: 80px; font-size: 16px; }
    button { width: 100%; padding: 12px; font-size: 16px; margin-top: 8px; }
    #answer { margin-top: 16px; white-space: pre-wrap; background: #f0f0f0; padding: 12px; border-radius: 8px; min-height: 40px; }
  </style>
</head>
<body>
  <h2>Ask the Yageno AI</h2>
  <textarea id="prompt" placeholder="Type your question..."></textarea>
  <button id="askBtn">Send</button>
  <div id="answer"></div>
  <script>
    const askBtn = document.getElementById('askBtn');
    const promptBox = document.getElementById('prompt');
    const answerBox = document.getElementById('answer');
    askBtn.addEventListener('click', async () => {
      const prompt = promptBox.value.trim();
      if (!prompt) return;
      answerBox.textContent = "Thinking... (can take 30-60s)";
      askBtn.disabled = true;
      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });
        const data = await res.json();
        answerBox.textContent = data.answer;
      } catch (err) {
        answerBox.textContent = "Error: " + err;
      }
      askBtn.disabled = false;
    });
  </script>
</body>
</html>
